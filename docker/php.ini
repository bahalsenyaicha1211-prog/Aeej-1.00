; Réglages PHP de production — copié dans $PHP_INI_DIR/conf.d/ par le Dockerfile.

; --- OPcache ---
; Sans OPcache, PHP recompile chaque fichier .php à chaque requête.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
; Le conteneur est reconstruit à chaque déploiement : inutile de revalider les
; timestamps à chaque hit.
opcache.validate_timestamps=0
opcache.save_comments=1

; --- Cache realpath ---
realpath_cache_size=4096K
realpath_cache_ttl=600

; --- Limites ---
memory_limit=256M
; Le chemin normal d'import galerie passe par le navigateur -> Cloudinary.
; Ces limites ne servent que pour le fallback serveur (JS désactivé).
upload_max_filesize=8M
post_max_size=40M
max_file_uploads=40
max_execution_time=60
